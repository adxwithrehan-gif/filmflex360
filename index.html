<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Movie Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-950 text-white min-p-6">
    <header class="p-4 text-center bg-gray-900 border-b border-gray-800">
        <h1 class="text-2xl font-bold text-red-500">🎬 CineHub Free Movies</h1>
    </header>
    
    <main class="container mx-auto p-4">
        <div id="movie-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <!-- Dynamic Movies Injected Here -->
        </div>
    </main>

    <script>
        fetch('movies.json')
            .then(res => res.json())
            .then(data => {
                const grid = document.getElementById('movie-grid');
                data.forEach(movie => {
                    grid.innerHTML += `
                        <div class="bg-gray-900 rounded-lg overflow-hidden shadow-lg border border-gray-800 flex flex-col justify-between">
                            <div>
                                <img src="${movie.poster}" alt="${movie.title}" class="w-full h-64 object-cover">
                                <div class="p-3">
                                    <h2 class="font-bold text-sm truncate">${movie.title} (${movie.year})</h2>
                                    <p class="text-xs text-yellow-400 mt-1">⭐ ${movie.rating}</p>
                                </div>
                            </div>
                            <div class="p-3 pt-0">
                                <a href="${movie.download}" target="_blank" class="block text-center bg-red-600 hover:bg-red-700 text-white text-xs font-bold py-2 rounded">Download / Watch</a>
                            </div>
                        </div>
                    `;
                });
            });
    </script>
</body>
</html>
