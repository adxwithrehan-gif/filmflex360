<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilmFlex360 - Free Movies & Series</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen">
    <header class="p-4 bg-gray-900 border-b border-gray-800 shadow-md flex flex-col md:flex-row items-center justify-between gap-4">
        <h1 class="text-2xl font-bold text-red-600 flex items-center gap-2">
            🎬 FilmFlex360
        </h1>
        <div class="w-full md:w-96">
            <input type="text" id="search-input" oninput="filterMovies()" placeholder="Search movies..." class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-red-600">
        </div>
    </header>
    
    <main class="container mx-auto p-4">
        <div id="movie-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
        <div class="text-center my-8">
            <button id="load-more" onclick="loadMoreMovies()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-6 rounded text-sm">Load More Movies</button>
        </div>
    </main>

    <!-- Built-in Video Player Modal -->
    <div id="video-modal" class="fixed inset-0 bg-black/90 hidden items-center justify-center p-4 z-50">
        <div class="bg-gray-900 rounded-lg overflow-hidden max-w-3xl w-full border border-gray-800 relative p-4">
            <button onclick="closeModal()" class="absolute top-3 right-3 text-gray-400 hover:text-white text-xl font-bold bg-gray-800 px-3 py-1 rounded-full z-10">✕</button>
            <h2 id="modal-title" class="text-lg font-bold mb-3 text-red-500"></h2>
            
            <div class="aspect-video bg-black rounded-lg overflow-hidden flex items-center justify-center relative">
                <!-- Internal Player Frame (Plays inside website, no Google redirect) -->
                <iframe id="modal-iframe" class="w-full h-full" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>

            <div class="mt-4 flex justify-end">
                <button onclick="closeModal()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold py-2 px-6 rounded text-xs">Close Player</button>
            </div>
        </div>
    </div>

    <script>
        let allMovies = [];
        let filteredMovies = [];
        let currentIndex = 0;
        const limit = 20;

        fetch('movies.json')
            .then(res => res.json())
            .then(data => {
                allMovies = data;
                filteredMovies = data;
                displayMovies();
            });

        function displayMovies(reset = false) {
            const grid = document.getElementById('movie-grid');
            if (reset) {
                grid.innerHTML = "";
                currentIndex = 0;
            }

            const nextBatch = filteredMovies.slice(currentIndex, currentIndex + limit);
            if (nextBatch.length === 0 && currentIndex === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-500 py-10">No movies found.</p>`;
                document.getElementById('load-more').style.display = 'none';
                return;
            }

            let htmlContent = "";
            nextBatch.forEach(movie => {
                const safeTitle = (movie.title || 'Movie').replace(/'/g, "\\'");
                htmlContent += `
                    <div class="bg-gray-900 rounded-lg overflow-hidden shadow-lg border border-gray-800 flex flex-col justify-between hover:border-red-600 transition">
                        <div>
                            <img src="${movie.poster || ''}" alt="${movie.title || 'Movie'}" class="w-full h-56 object-cover" loading="lazy">
                            <div class="p-3">
                                <h2 class="font-bold text-sm truncate">${movie.title || 'Untitled'} (${movie.year || ''})</h2>
                                <p class="text-xs text-yellow-400 mt-1">⭐ ${movie.rating || 'N/A'}</p>
                            </div>
                        </div>
                        <div class="p-3 pt-0">
                            <button onclick="openPlayer('${safeTitle}')" class="w-full text-center bg-red-600 hover:bg-red-700 text-white text-xs font-bold py-2 rounded">▶ Play Movie</button>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML += htmlContent;
            currentIndex += limit;

            const loadMoreBtn = document.getElementById('load-more');
            if (currentIndex < filteredMovies.length) {
                loadMoreBtn.style.display = 'inline-block';
            } else {
                loadMoreBtn.style.display = 'none';
            }
        }

        function loadMoreMovies() {
            displayMovies(false);
        }

        function filterMovies() {
            const query = document.getElementById('search-input').value.toLowerCase();
            filteredMovies = allMovies.filter(movie => 
                (movie.title && movie.title.toLowerCase().includes(query))
            );
            displayMovies(true);
        }

        function openPlayer(title) {
            const modal = document.getElementById('video-modal');
            const modalTitle = document.getElementById('modal-title');
            const iframeElem = document.getElementById('modal-iframe');

            modalTitle.innerText = title;
            // Automatically embed a secure built-in player search using the movie title
            iframeElem.src = `https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(title + ' official trailer full movie')} &autoplay=1`;
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('video-modal');
            const iframeElem = document.getElementById('modal-iframe');
            
            iframeElem.src = ""; // Stop video playback when closed
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
    </script>
</body>
</html>
